// The build for one Minecraft version group, applied to each project in versions/ (build.gradle).
// Its gradle.properties says:
//   minecraft_version   the version compiled against (the newest of the group)
//   minecraft_range     the versions it runs on, as fabric.mod.json's "minecraft" (e.g. ">=1.21 <=1.21.1")
//   fabric_api_version  Fabric API for that version (only a few of its modules, bundled into the jar)
//   java_version        21 for 1.21.x, 25 for 26.x
//   loader_min          the oldest Fabric Loader it asks for
//
// The source is src/main/java (shared with the Paper plugin) and src/fabric/java (the Fabric entry point and the
// mixins), as written for the newest version and run through the preprocessor (preprocess.gradle).

def mc = project.property('minecraft_version') as String
def remap = !(mc ==~ /^\d{2,}\..*/) // 26.x and later are unobfuscated
def javaVersion = (project.property('java_version') as String).toInteger()

apply plugin: remap ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

base {
	archivesName = 'mcstats-chat'
}
version = "${rootProject.property('version')}+mc${project.name}"
group = rootProject.property('group')

repositories {
	mavenCentral()
}

// The bits of Fabric API the mod uses, built into its jar so the server needn't install Fabric API.
// Chat needs the message and lifecycle events; Liveview adds its /liveview command and the events its
// action feed is built from (blocks broken and used, attacks, deaths, joins). Read by scripts/mod-info.mjs.
def fabricApiModules = ['fabric-api-base', 'fabric-message-api-v1', 'fabric-lifecycle-events-v1',
		'fabric-command-api-v2', 'fabric-entity-events-v1', 'fabric-events-interaction-v0', 'fabric-networking-api-v1']

dependencies {
	minecraft "com.mojang:minecraft:${mc}"
	if (remap) mappings loom.officialMojangMappings()
	def impl = remap ? 'modImplementation' : 'implementation'
	add(impl, "net.fabricmc:fabric-loader:${rootProject.property('loader_version')}")
	for (name in fabricApiModules) {
		def dep = fabricApi.module(name, project.property('fabric_api_version') as String)
		add(impl, dep)
		add('include', dep)
	}
}

ext.preprocessMc = mc
ext.preprocessPlatform = 'fabric'
ext.preprocessRoots = [rootProject.file('src/main/java'), rootProject.file('src/fabric/java')]
apply from: rootProject.file('preprocess.gradle')

sourceSets {
	main {
		java.srcDirs = [preprocessedJava]
		resources.srcDirs = [rootProject.file('src/fabric/resources')]
	}
}
tasks.named('compileJava') { dependsOn 'preprocessJava' }
// Loom's sources jar and anything else reading the source get the preprocessed copy too
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn 'preprocessJava' }

processResources {
	def props = [
			version  : rootProject.property('version'),
			minecraft: project.property('minecraft_range'),
			java     : ">=${javaVersion}",
			loader   : ">=${project.property('loader_min')}",
			mixinJava: "JAVA_${javaVersion}",
	]
	inputs.properties(props)
	filesMatching(['fabric.mod.json', '*.mixins.json']) {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.toVersion(javaVersion)
	targetCompatibility = JavaVersion.toVersion(javaVersion)
}
