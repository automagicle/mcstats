org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# the preprocessor in target.gradle is a script closure, which the configuration cache can't keep
org.gradle.configuration-cache=false

# Shared by every version (versions/<mc>/gradle.properties has each one's Minecraft and Fabric API).
# Fabric versions: https://fabricmc.net/develop
loader_version=0.20.1
loom_version=1.19.3
# Paper: https://github.com/PaperMC/paperweight
paperweight_version=2.0.0-beta.24

# The version the dashboard serves by default and calls "built for" (scripts/mod-info.mjs).
minecraft_version=26.2
fabric_api_version=0.161.0+26.2

version=2.4.0
group=dev.mcserverstats
