// One build per Minecraft version group: each target in versions/<mc>/ compiles the same source
// (src/main), run through the preprocessor in target.gradle for that version. See versions/README.md.
//   ./gradlew build            every version's jar, collected in build/libs/
//   ./gradlew :26.2:build      one version
plugins {
	// 26.x is unobfuscated (Mojang's names, no remapping); 1.21.x is obfuscated and remapped to
	// intermediary names, with Mojang's names used while compiling.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
	apply from: rootProject.file('target.gradle')
}

// Every target's jar, in build/libs/ (what npm run build:mod copies to the website).
tasks.register('build') {
	group = 'build'
	description = 'Builds the mod for every Minecraft version.'
	dependsOn subprojects.collect { "${it.path}:build" }
	doLast {
		def out = layout.buildDirectory.dir('libs').get().asFile
		out.mkdirs()
		subprojects.each { p ->
			p.layout.buildDirectory.dir('libs').get().asFile.listFiles()
				?.findAll { it.name.endsWith('.jar') && !it.name.contains('-sources') }
				?.each { f -> java.nio.file.Files.copy(f.toPath(), new File(out, f.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
		}
	}
}
tasks.register('clean', Delete) {
	delete layout.buildDirectory
	dependsOn subprojects.collect { "${it.path}:clean" }
}
