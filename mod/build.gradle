// One Fabric jar per Minecraft version group (versions/<mc>/, target.gradle) and one Paper plugin jar per
// Minecraft version (paper/<mc>/, paper.gradle), all from the same shared source (src/main) plus each
// platform's own (src/fabric, src/paper), run through the preprocessor (preprocess.gradle) for that version.
//   ./gradlew build              every jar, collected in build/libs/
//   ./gradlew :26.2:build        one Fabric version
//   ./gradlew :paper-26.2:build  one Paper version
plugins {
	// 26.x is unobfuscated (Mojang's names, no remapping); 1.21.x is obfuscated and remapped to
	// intermediary names, with Mojang's names used while compiling.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
	// Paper: compiled against the server itself, in Mojang's names
	id 'io.papermc.paperweight.userdev' version "${paperweight_version}" apply false
}

subprojects {
	apply from: rootProject.file(name.startsWith('paper-') ? 'paper.gradle' : 'target.gradle')
}

// Every target's jar, in build/libs/ (what npm run build:mod copies to the website).
tasks.register('build') {
	group = 'build'
	description = 'Builds the Fabric mod and the Paper plugin for every Minecraft version.'
	dependsOn subprojects.collect { "${it.path}:build" }
	doLast {
		def out = layout.buildDirectory.dir('libs').get().asFile
		out.mkdirs()
		subprojects.each { p ->
			p.layout.buildDirectory.dir('libs').get().asFile.listFiles()
				?.findAll { it.name.endsWith('.jar') && !it.name.contains('-sources') }
				?.each { f -> java.nio.file.Files.copy(f.toPath(), new File(out, f.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING) }
		}
	}
}
tasks.register('clean', Delete) {
	delete layout.buildDirectory
	dependsOn subprojects.collect { "${it.path}:clean" }
}
